name: Check SPL fixtures for changes
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Force a test alert (labelled TEST)'
        type: boolean
        default: false
      test_baseline:
        description: 'Simulate a lost baseline (labelled TEST)'
        type: boolean
        default: false
permissions:
  contents: read
  issues: write
  actions: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: snap.json
          key: spl-snap-none
          restore-keys: spl-snap-
      - name: Fetch all SPL matches and compare
        env:
          OPENFOOT_KEY: ${{ secrets.OPENFOOT_API_KEY }}
          TEST_ALERT: ${{ inputs.test_alert }}
          TEST_BASE: ${{ inputs.test_baseline }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          H={"Authorization":"Bearer "+os.environ["OPENFOOT_KEY"]}
          base="https://openfootapi.com/v1/matches?competition=comp_saudi_pro_league_sau&limit=100"
          new={};cur=None
          while True:
              u=base+("&cursor="+cur if cur else "")
              j=json.load(urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=30))
              for m in j["data"]:
                  new[m["id"]]=[m["status"],m["kickoffAt"]]
              cur=(j.get("meta",{}).get("pagination") or {}).get("next_cursor")
              if not cur: break
          assert len(new)>100, "unexpectedly small match list: %d"%len(new)
          old=json.load(open("snap.json")) if os.path.exists("snap.json") else None
          if os.environ.get("TEST_BASE")=="true": old=None
          if old is not None and os.environ.get("TEST_ALERT")=="true":
              k=next(i for i,v in new.items() if v[0]=="scheduled"); old[k]=["scheduled","2000-01-01T00:00:00Z"]
          changes=[]
          if old is None:
              up=sorted((v[1],k,v[0]) for k,v in new.items() if v[0]!="finished")[:15]
              changes=[(k,"baseline-missing",st,ko) for ko,k,st in up]
          else:
              for k,(st,ko) in new.items():
                  o=old.get(k)
                  if o is None:
                      if st!="finished": changes.append((k,"new",st,ko))
                  elif o[0]=="scheduled":
                      if st in("postponed","cancelled","unknown") or (st=="scheduled" and o[1]!=ko):
                          changes.append((k,"changed",st,ko))
          json.dump(new,open("snap.json","w"))
          lines=[]
          out=open(os.environ["GITHUB_ENV"],"a")
          title="SPL baseline missing - review required" if old is None else "SPL fixture change detected"
          if os.environ.get("TEST_ALERT")=="true" or os.environ.get("TEST_BASE")=="true": title="TEST - "+title
          out.write("TITLE=%s\n"%title)
          out.write("COUNT=%d\nTOTAL=%d\nBASELINE=%s\n"%(len(changes),len(new),"0" if old is not None else "1"))
          open("issue.txt","w").write("\n".join(lines))
          PY
      - name: Open an issue when something changed
        if: env.COUNT != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TESTFLAG: ${{ inputs.test_alert }}
        run: |
          T="$TITLE"
          { echo "@monasbati-riyadh SPL fixture check needs review."; echo; echo "The daily check flagged a change or a lost baseline. No match data is published here."; echo; echo "Action: verify the whole official SPL schedule against the site list, update the site from official sources, then close this issue."; } > body.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$T" --body-file body.md
      - uses: actions/cache/save@v4
        with:
          path: snap.json
          key: spl-snap-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/check-fixtures.yml/enable" || true
      - name: Summary
        run: echo "tracked=$TOTAL changes=$COUNT baseline_run=$BASELINE" >> "$GITHUB_STEP_SUMMARY"
