name: Publish site
on:
  push:
    branches: [main]
    paths:
      - index.html
      - build_site.py
      - .github/workflows/publish-site.yml
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build page with fixtures
        env:
          FD_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: python3 build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
